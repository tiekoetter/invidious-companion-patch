name: Check invidious-companion Submodule

on:
  schedule:
    - cron: '19 3 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  statuses: write

concurrency:
  group: bump-invidious-companion-submodule
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Update invidious-companion submodule
        id: update
        shell: bash
        run: |
          before="$(git rev-parse HEAD:invidious-companion)"

          git submodule update --remote -- invidious-companion

          after="$(git -C invidious-companion rev-parse HEAD)"
          {
            echo "before=${before}"
            echo "after=${after}"
            if [[ "${before}" == "${after}" ]]; then
              echo "changed=false"
            else
              echo "changed=true"
            fi
          } >> "${GITHUB_OUTPUT}"

      - name: Verify patches still apply
        id: verify
        if: steps.update.outputs.changed == 'true'
        shell: bash
        run: |
          git -C invidious-companion config user.email "github-actions[bot]@users.noreply.github.com"
          git -C invidious-companion config user.name "github-actions[bot]"

          patch_dir="${GITHUB_WORKSPACE:-${PWD}}/patches"

          if git -C invidious-companion am --3way "${patch_dir}"/*.patch; then
            patches_apply=true
          else
            patches_apply=false
            git -C invidious-companion am --abort 2>/dev/null || true
          fi

          echo "patches_apply=${patches_apply}" >> "${GITHUB_OUTPUT}"

      - name: Verify patched invidious-companion
        id: checks
        if: steps.verify.outputs.patches_apply == 'true'
        continue-on-error: true
        uses: ./.github/actions/verify-companion

      - name: Restore the bumped submodule checkout
        if: steps.update.outputs.changed == 'true'
        shell: bash
        env:
          AFTER: ${{ steps.update.outputs.after }}
        run: |
          git -C invidious-companion reset --hard "${AFTER}"

      - name: Create bump pull request
        id: cpr
        if: steps.update.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          branch: automation/bump-invidious-companion
          delete-branch: true
          commit-message: 'chore: bump invidious-companion submodule'
          committer: 'github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>'
          author: 'github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>'
          title: 'chore: bump invidious-companion submodule'
          body: |
            This scheduled workflow found a newer upstream invidious-companion commit.

            - Previous submodule commit: `${{ steps.update.outputs.before }}`
            - New submodule commit: `${{ steps.update.outputs.after }}`
            - Patch application check: `${{ steps.verify.outputs.patches_apply }}`
            - Patch verification (type-check, lint, offline tests): `${{ steps.checks.outcome || 'skipped' }}`

            The patch application check replays `patches/*.patch` onto the bumped submodule commit and is separate from whether this PR has merge conflicts with the base branch. The patch verification then checks the patched result and is skipped when the patches do not apply.

            If the patch application check is `false` or the patch verification is `failure`, the submodule pointer was still updated here so the patches can be fixed in this PR.
          add-paths: |
            invidious-companion

      - name: Report patch status on pull request
        if: steps.update.outputs.changed == 'true' && steps.cpr.outputs.pull-request-head-sha != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ steps.cpr.outputs.pull-request-head-sha }}
          PATCHES_APPLY: ${{ steps.verify.outputs.patches_apply }}
          CHECKS_OUTCOME: ${{ steps.checks.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [[ "${PATCHES_APPLY}" == "true" ]]; then
            state=success
            description="All patches apply to the bumped submodule"
          else
            state=failure
            description="One or more patches failed to apply"
          fi

          gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${HEAD_SHA}" \
            -f "state=${state}" \
            -f "context=Patch application check" \
            -f "description=${description}" \
            -f "target_url=${RUN_URL}"

          if [[ "${CHECKS_OUTCOME}" == "success" ]]; then
            state=success
            description="Type-check, lint and offline tests pass with the patches"
          elif [[ "${CHECKS_OUTCOME}" == "failure" ]]; then
            state=failure
            description="Type-check, lint or offline tests fail with the patches"
          else
            exit 0
          fi

          gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${HEAD_SHA}" \
            -f "state=${state}" \
            -f "context=Patch verification" \
            -f "description=${description}" \
            -f "target_url=${RUN_URL}"

      - name: Fail when patches need attention
        if: steps.verify.outputs.patches_apply == 'false'
        shell: bash
        run: |
          echo "::error::The bump PR is mergeable, but one or more patches did not apply to the bumped invidious-companion checkout. See the 'Verify patches still apply' step for the git-am output."
          exit 1

      - name: Fail when the patched checkout does not verify
        if: steps.checks.outcome == 'failure'
        shell: bash
        run: |
          echo "::error::The patches apply to the bumped invidious-companion checkout, but type-check, lint or the offline tests failed. See the 'Verify patched invidious-companion' step."
          exit 1
